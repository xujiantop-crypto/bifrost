name: Gemini client signature offline validation
on:
  push:
    branches: [test/gemini-client-thought-signature-validation-v3]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: '247dba4f6d7ff1ee9ed4cb11429d6170bf916b41'
      SOURCE_TREE: 'd7d41a69ae2e3f61fd7cae41014cf3dbb77ea93e'
      SOURCE_PARENT_SHA: 'da1ebf4683515be9ef8dd79d8c811871f926d7ae'
      GOWORK: 'off'
      GEMINI_API_KEY: ''
      VERTEX_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xujiantop-crypto/bifrost
          ref: '247dba4f6d7ff1ee9ed4cb11429d6170bf916b41'
          fetch-depth: 2
          persist-credentials: false
      - name: Verify frozen source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/signature-validation"
          git show -s --format='source=%H%ntree=%T%nparents=%P%nauthor=%an <%ae>%ncommitter=%cn <%ce>' HEAD > "$RUNNER_TEMP/signature-validation/source-binding.txt"
          printf 'workflow=%s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/signature-validation/source-binding.txt"
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove newline-only fallback regressions against prior converter
        run: |
          set -euo pipefail
          converter=core/providers/gemini/utils.go
          original_blob=$(git rev-parse "$SOURCE_SHA:$converter")
          prior_blob=$(git rev-parse "$SOURCE_PARENT_SHA:$converter")
          restore_source() {
            git show "$SOURCE_SHA:$converter" > "$converter"
            test "$(git hash-object "$converter")" = "$original_blob"
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
            test -z "$(git status --porcelain)"
          }
          trap restore_source EXIT
          git show "$SOURCE_PARENT_SHA:$converter" > "$converter"
          test "$(git hash-object "$converter")" = "$prior_blob"
          printf 'source=%s\nprior_converter_source=%s\nprior_converter_blob=%s\nfinal_converter_blob=%s\n' "$SOURCE_SHA" "$SOURCE_PARENT_SHA" "$prior_blob" "$original_blob" > "$RUNNER_TEMP/signature-validation/red-binding.txt"
          set +e
          (cd core && go test -count=1 -json -run '^TestGeminiChatClientThoughtSignatureFallbacks$/^(newline-only_ID_falls_back_to_reasoning|newline-only_reasoning_falls_back_to_metadata)$' ./providers/gemini) > "$RUNNER_TEMP/signature-validation/prior-converter-red.jsonl" 2> "$RUNNER_TEMP/signature-validation/red-stderr.txt"
          red_exit=$?
          set -e
          cat "$RUNNER_TEMP/signature-validation/prior-converter-red.jsonl"
          cat "$RUNNER_TEMP/signature-validation/red-stderr.txt"
          test "$red_exit" = 1
          printf 'exit=%s\n' "$red_exit" >> "$RUNNER_TEMP/signature-validation/red-binding.txt"
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.RUNNER_TEMP + '/signature-validation/';
          const events = fs.readFileSync(path + 'prior-converter-red.jsonl', 'utf8').trim().split('\n').map(JSON.parse);
          const root = 'TestGeminiChatClientThoughtSignatureFallbacks';
          const expected = new Map([
            [root + '/newline-only_ID_falls_back_to_reasoning', '[]byte{0x4, 0x5, 0x6}'],
            [root + '/newline-only_reasoning_falls_back_to_metadata', '[]byte{0xfb, 0xff}'],
          ]);
          const failed = events.filter(e => e.Action === 'fail' && e.Test).map(e => e.Test).sort();
          if (JSON.stringify(failed) !== JSON.stringify([root, ...expected.keys()].sort())) throw new Error('Unexpected failing tests: ' + failed);
          for (const [name, value] of expected) {
            const output = events.filter(e => e.Test === name && e.Output).map(e => e.Output).join('');
            if (!output.includes('Not equal:') || !output.includes('expected: ' + value) || !output.includes('actual  : []byte{}')) throw new Error('Missing expected empty-signature assertion: ' + name);
          }
          const allOutput = events.filter(e => e.Output).map(e => e.Output).join('') + fs.readFileSync(path + 'red-stderr.txt', 'utf8');
          if (/panic:|build failed|setup failed/i.test(allOutput) || events.some(e => e.Action === 'pass' && e.Test)) throw new Error('Unexpected setup failure or passing selection');
          fs.writeFileSync(path + 'red-proof.json', JSON.stringify({priorConverterSource: process.env.SOURCE_PARENT_SHA, finalTestsSource: process.env.SOURCE_SHA, exit: 1, assertionFailures: [...expected.keys()], passedTests: 0}, null, 2));
          NODE
          restore_source
          trap - EXIT
      - name: Canonical scoped Gemini tests
        run: |
          set -euo pipefail
          go version | tee "$RUNNER_TEMP/signature-validation/go-version.txt"
          make test-core PROVIDER=gemini PATTERN=ClientThoughtSignature | tee "$RUNNER_TEMP/signature-validation/canonical-make.txt"
      - name: Native conversion and retry race regressions
        run: |
          set -euo pipefail
          cd core
          go test -race -count=1 -run ClientThoughtSignature -v ./providers/gemini . | tee "$RUNNER_TEMP/signature-validation/race.txt"
      - name: Vet impacted packages and verify formatting
        run: |
          set -euo pipefail
          cd core
          go vet . ./providers/gemini ./providers/vertex 2>&1 | tee "$RUNNER_TEMP/signature-validation/vet.txt"
          test -z "$(gofmt -l providers/gemini/utils.go providers/gemini/chat_test.go encryptedreasoning.go encryptedreasoning_test.go)"
      - name: Provider harness structure
        run: |
          set -euo pipefail
          node tests/e2e/api/runners/augment-provider-harness.mjs --source tests/e2e/api/collections/provider-harness.json --out "$RUNNER_TEMP/signature-validation/harness-augmented.json"
          node tests/e2e/api/runners/filter-collection.mjs --source "$RUNNER_TEMP/signature-validation/harness-augmented.json" --out "$RUNNER_TEMP/signature-validation/harness-filtered.json" --feature 'client-thought-signature-fixture'
          node -e 'const fs=require("node:fs");const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const names=[];function walk(items){for(const item of items||[]){if(item.request)names.push(item.name);walk(item.item);}}walk(data.item);if(names.length!==6)throw new Error("Expected six signature fixture requests, got "+names.length);fs.writeFileSync(process.argv[2],JSON.stringify({requests:names.length,names},null,2));' "$RUNNER_TEMP/signature-validation/harness-filtered.json" "$RUNNER_TEMP/signature-validation/harness-count.json"
          node --test tests/e2e/api/runners/gemini-client-signature-fixture.test.mjs | tee "$RUNNER_TEMP/signature-validation/fixture-script-tests.txt"
      - name: Save scoped JUnit
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/signature-validation/junit"
          if [ -d test-reports ]; then cp -R test-reports/. "$RUNNER_TEMP/signature-validation/junit/"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-client-signature-offline
          path: ${{ runner.temp }}/signature-validation
          if-no-files-found: error
